name: Sync tag 141.0.7390.77 to Gogs

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror single tag to Gogs
        env:
          GOGS_USER: maoguojun
          GOGS_TOKEN: ${{ secrets.GOGS_TOKEN }}
        run: |
          # 1. 裸克隆指定 tag（无工作目录，体积骤减）
          git clone --mirror --filter=blob:none \
            --branch 141.0.7390.77 \
            https://${{ secrets.GITHUB_TOKEN }}@github.com/chromium/chromium.git mirror
          cd mirror

          # 2. 加 Gogs 远程并强推
          git remote add gogs http://${GOGS_USER}:${GOGS_TOKEN}@110.16.79.210:39816/maoguojun/chromium.git
          git push gogs 141.0.7390.77 --force
