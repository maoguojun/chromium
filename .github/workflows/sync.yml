name: Stream tag 141.0.7390.77 to Gogs

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Push tag without local checkout
        env:
          GOGS_USER: maoguojun
          GOGS_TOKEN: ${{ secrets.GOGS_TOKEN }}
        run: |
          # 建一个空目录即可，不拉文件
          mkdir tmp && cd tmp
          git init --bare

          # 流式抓取指定 tag（对象边走边传）
          git remote add gh https://${{ secrets.GITHUB_TOKEN }}@github.com/chromium/chromium.git
          git remote add gogs http://${GOGS_USER}:${GOGS_TOKEN}@110.16.79.210:39816/maoguojun/chromium.git

          git fetch gh tag 141.0.7390.77 --no-tags
          git push gogs 141.0.7390.77 --force
