name: Sync tag 141.0.7390.77 to Gitee
on:
  workflow_dispatch:   # 仅手动触发
jobs:
  sync-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout single tag (shallow)
        run: |
          git clone --branch 141.0.7390.77 --depth 1 \
            https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
      - name: Push tag to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
        run: |
          # 把 Gitee 加为远程
          git remote add gitee https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/chromium.git
          # 推送该 tag（含对应 commit）
          git push gitee 141.0.7390.77 --force
